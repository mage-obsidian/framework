exclude: '(^|/)(generated|\.precompiled|dist|node_modules|vendor|\.artifacts|playwright-report|__mocks__|fixtures)/|/web/critical/|__tests__/magento_scenarios/'
repos:
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: insert-license
        name: SPDX header (PHP) packages/component-modern-frontend
        files: '^packages/component-modern-frontend/.*\.php$'
        args: [--license-filepath, packages/component-modern-frontend/.license-header.txt, --no-extra-eol, --allow-past-years, --detect-license-in-X-top-lines, '16', --comment-style, '/**| *| */', --insert-license-after-regex, '^<\?php$']
      - id: insert-license
        name: SPDX header (PHTML) packages/component-modern-frontend
        files: '^packages/component-modern-frontend/.*\.phtml$'
        args: [--license-filepath, packages/component-modern-frontend/.license-header.txt, --no-extra-eol, --allow-past-years, --detect-license-in-X-top-lines, '16', --comment-style, '<?php /**| *| */ ?>']
      - id: insert-license
        name: SPDX header (Twig) packages/component-modern-frontend
        files: '^packages/component-modern-frontend/.*\.twig$'
        args: [--license-filepath, packages/component-modern-frontend/.license-header.txt, --no-extra-eol, --allow-past-years, --detect-license-in-X-top-lines, '16', --comment-style, '{#||#}']
      - id: insert-license
        name: SPDX header (Vue and HTML) packages/component-modern-frontend
        files: '^packages/component-modern-frontend/.*\.(vue|html)$'
        args: [--license-filepath, packages/component-modern-frontend/.license-header.txt, --no-extra-eol, --allow-past-years, --detect-license-in-X-top-lines, '16', --comment-style, '<!--||-->']
      - id: insert-license
