        files: '^packages/component-modern-frontend/.*\.xml$'
        args: [--license-filepath, packages/component-modern-frontend/.license-header.txt, --no-extra-eol, --allow-past-years, --detect-license-in-X-top-lines, '16', --comment-style, '<!--||-->', --insert-license-after-regex, '^<\?xml.*\?>$']
      - id: insert-license
        name: SPDX header (TypeScript and JavaScript) packages/component-modern-frontend
        files: '^packages/component-modern-frontend/.*\.(ts|js|mjs)$'
        args: [--license-filepath, packages/component-modern-frontend/.license-header.txt, --no-extra-eol, --allow-past-years, --detect-license-in-X-top-lines, '16', --comment-style, '//']
