name: Announce

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to announce
        required: true

jobs:
  discord:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: mage-obsidian/.github/.github/workflows/discord-release.yml@main
    with:
      tag: ${{ inputs.tag || github.event.workflow_run.head_branch }}
      ping_role_id: ${{ vars.DISCORD_RELEASE_ROLE_ID }}
    secrets:
      DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
